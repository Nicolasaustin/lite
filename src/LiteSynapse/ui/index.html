<!doctype html>
<html lang="en" data-accent="mint">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>LiteSynapse</title>
<!--
  LiteSynapse main window. One self-contained page (inline CSS + vanilla JS, no external resources) that the app
  loads into WebView2 with NavigateToString. It talks to the app only through the message bridge described in
  docs/bridge-api.md (v1.2). Outside WebView2 it uses window.__mockBridge (tools/ui-preview) or shows a short
  "Open from LiteSynapse" screen.
  Lightweight by design: no timers or polling (the app pushes state), no animations while idle.
-->
<style>
:root {
  --bg: #0D0E11;
  --side: #0F1014;
  --surface: #15171C;
  --surface-2: #1B1E24;
  --surface-3: #23262D;
  --surface-4: #2B2F37;
  --field: #101216;
  --line: rgba(255, 255, 255, .06);
  --line-2: rgba(255, 255, 255, .075);
  --line-3: rgba(255, 255, 255, .11);
  --text: #E9EBEF;
  --muted: #8E949E;
  --faint: #636975;
  --accent: #2EE6A6;
  --on-accent: #0A0C0F;
  --accent-soft: color-mix(in srgb, var(--accent) 13%, transparent);
  --accent-line: color-mix(in srgb, var(--accent) 42%, transparent);
  --accent-text: color-mix(in srgb, var(--accent) 82%, white);
  --danger: #FF5D6C;
  --danger-text: #FF8C96;
  --warn: #F5B544;
  --ok: #3DD68C;
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --t: 150ms;
  --sidebar-w: 236px;
  --pad-x: 36px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
}
[data-accent="green"] { --accent: #44D62C; }
[data-accent="blue"] { --accent: #4F8CFF; }
[data-accent="violet"] { --accent: #8B7BFF; }
[data-accent="amber"] { --accent: #FFB547; }
@media (max-width: 1100px) { :root { --sidebar-w: 212px; --pad-x: 28px; } }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); font: 14px/1.45 var(--font);
  -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none; cursor: default;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
input, textarea, .selectable, pre { user-select: text; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.ico { flex: none; display: block; }
b, strong { font-weight: 600; color: var(--text); }
h1, h2, h3 { margin: 0; }
p { margin: 0; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .09); border-radius: 12px; border: 4px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background-color: rgba(255, 255, 255, .17); }
::-webkit-scrollbar-corner { background: transparent; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation-duration: 1ms !important; } }

/* ---- App frame ------------------------------------------------------------------------------- */
#app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); height: 100vh; }
#app[hidden] { display: none; }
.sidebar {
  display: flex; flex-direction: column; min-height: 0; padding: 18px 12px 14px;
  background: var(--side); border-right: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 11px; padding: 2px 10px 22px; }
.mark {
  width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center;
  background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 78%, white) 0%, var(--accent) 42%, color-mix(in srgb, var(--accent) 62%, black) 100%);
  box-shadow: 0 6px 18px -6px color-mix(in srgb, var(--accent) 55%, transparent), inset 0 1px 0 rgba(255, 255, 255, .35);
}
.mark.lg { width: 56px; height: 56px; border-radius: 16px; }
.brand-name { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.brand-sub { font-size: 11.5px; color: var(--faint); margin-top: 1px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px;
  border: 0; border-radius: 10px; background: transparent; color: var(--muted);
  font-size: 13.5px; font-weight: 500; text-align: left;
  transition: background var(--t), color var(--t);
}
.nav-item:hover { background: rgba(255, 255, 255, .04); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--surface-2); color: var(--text); }
.nav-item[aria-current="page"]::before {
  content: ""; position: absolute; left: -12px; top: 11px; bottom: 11px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--accent);
}
.nav-item[aria-current="page"] .ico { color: var(--accent); }
.nav-tail { margin-left: auto; display: flex; align-items: center; }
.nav-count { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--faint); }
.dot.warn { background: var(--warn); }
.dot.ok { background: var(--ok); }
.dot.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
.auto-pill {
  display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line-2);
}
.auto-pill .lbl { font-size: 12.5px; font-weight: 600; }
.auto-pill .sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.auto-pill .txt { min-width: 0; flex: 1; }
.auto-pill .state { display: inline-flex; align-items: center; gap: 6px; }
.version { font-size: 11.5px; color: var(--faint); padding: 0 12px; }

main {
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: radial-gradient(1000px 340px at 100% -120px, color-mix(in srgb, var(--accent) 6%, transparent), transparent 70%);
}
.header { padding: 26px var(--pad-x) 0; display: flex; flex-direction: column; gap: 18px; }
.header-row { display: flex; align-items: center; gap: 16px; min-height: 52px; }
.header-text { min-width: 0; }
.title { font-size: 24px; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; }
.subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; display: flex; align-items: center; gap: 8px; }
.header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex: none; }
#scroller { flex: 1; overflow: auto; min-height: 0; scrollbar-gutter: stable; }
#page { padding: 20px var(--pad-x) 40px; max-width: 1180px; }

/* ---- Building blocks ------------------------------------------------------------------------- */
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack.tight { gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.grid { display: grid; gap: 16px; }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
.mono { font-family: var(--mono); font-size: .92em; }
.nowrap { white-space: nowrap; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }

.card {
  background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius-lg); padding: 20px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .025);
}
.card.flush { padding: 0; }
.card-h { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.card-h .txt { min-width: 0; }
.card-t { font-size: 14.5px; font-weight: 600; letter-spacing: -.005em; display: flex; align-items: center; gap: 8px; }
.card-s { font-size: 12.5px; color: var(--muted); margin-top: 3px; max-width: 640px; }
.card-h .end { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
.tile-ico {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none;
  background: var(--surface-3); color: var(--muted); border: 1px solid var(--line-2);
}
.tile-ico.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.divider { height: 1px; background: var(--line); margin: 4px 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px;
  border-radius: 10px; border: 1px solid var(--line-3); background: var(--surface-3); color: var(--text);
  font-size: 13px; font-weight: 550; white-space: nowrap; flex: none;
  transition: background var(--t), border-color var(--t), color var(--t), box-shadow var(--t);
}
.btn:hover { background: var(--surface-4); }
.btn:active { transform: translateY(.5px); }
.btn[disabled] { opacity: .42; pointer-events: none; }
.btn .ico { color: inherit; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 86%, white); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: rgba(255, 255, 255, .05); color: var(--text); }
.btn.danger { color: var(--danger-text); }
.btn.danger:hover { background: color-mix(in srgb, var(--danger) 13%, transparent); border-color: color-mix(in srgb, var(--danger) 32%, transparent); }
.btn.danger.solid { background: var(--danger); border-color: transparent; color: #18060A; }
.btn.danger.solid:hover { background: color-mix(in srgb, var(--danger) 86%, white); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; gap: 6px; }
.btn.lg { height: 40px; padding: 0 18px; font-size: 13.5px; }
.btn.icon { width: 34px; padding: 0; }
.btn.icon.sm { width: 28px; }
.btn.busy { pointer-events: none; opacity: .7; }
.link { background: none; border: 0; padding: 0; color: var(--accent-text); font-weight: 550; display: inline-flex; align-items: center; gap: 4px; }
.link:hover { text-decoration: underline; }

.switch {
  position: relative; width: 40px; height: 22px; flex: none; padding: 0; border-radius: 999px;
  border: 1px solid var(--line-3); background: #2A2E36; transition: background var(--t), border-color var(--t);
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%;
  background: #C9CDD4; transition: transform 160ms var(--ease), background var(--t);
}
.switch[aria-checked="true"] { background: var(--accent); border-color: transparent; }
.switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--on-accent); }
.switch[disabled] { opacity: .4; pointer-events: none; }

.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; background: rgba(255, 255, 255, .06); color: var(--muted); white-space: nowrap; flex: none;
}
.badge.accent { background: var(--accent-soft); color: var(--accent-text); }
.badge.warn { background: color-mix(in srgb, var(--warn) 13%, transparent); color: var(--warn); }
.badge.danger { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger-text); }
.badge.ok { background: color-mix(in srgb, var(--ok) 13%, transparent); color: var(--ok); }
.badge.outline { background: transparent; box-shadow: inset 0 0 0 1px var(--line-3); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--line-2); font-size: 12.5px; color: var(--text); white-space: nowrap;
}
button.chip { transition: background var(--t), border-color var(--t), color var(--t); }
button.chip:hover { background: var(--surface-3); border-color: var(--line-3); }
.chip.dashed { background: transparent; border-style: dashed; border-color: var(--line-3); color: var(--muted); }
.chip.dashed:hover { color: var(--text); }
.chip-x {
  display: grid; place-items: center; width: 18px; height: 18px; margin-right: -5px; border: 0; border-radius: 5px;
  background: transparent; color: var(--faint); padding: 0;
}
.chip-x:hover { background: rgba(255, 255, 255, .08); color: var(--text); }
.kc {
  display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 8px;
  border-radius: 7px; background: linear-gradient(180deg, #2B2F37, #23262D); border: 1px solid var(--line-3);
  box-shadow: 0 2px 0 rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
  font-size: 12.5px; font-weight: 600; white-space: nowrap; color: var(--text);
}
.kc.lg { min-width: 46px; height: 46px; padding: 0 14px; border-radius: 11px; font-size: 18px; font-weight: 650; }
.kc.accent { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 22%, #2B2F37), color-mix(in srgb, var(--accent) 12%, #23262D)); border-color: var(--accent-line); color: var(--accent-text); }
.kc.dim { color: var(--muted); }
.kc.off { background: transparent; border-style: dashed; box-shadow: none; color: var(--muted); }
.plus { color: var(--faint); font-weight: 600; }

.field { display: flex; flex-direction: column; gap: 8px; }
.field-l { font-size: 12px; font-weight: 600; color: var(--muted); }
.input {
  height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-3); background: var(--field);
  color: var(--text); font-size: 13px; min-width: 0; transition: border-color var(--t), box-shadow var(--t);
}
.input:hover { border-color: rgba(255, 255, 255, .16); }
.input:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
.input::placeholder { color: var(--faint); }
.input[type="number"] { font-variant-numeric: tabular-nums; }
.input[type="number"]::-webkit-inner-spin-button { opacity: .35; }
.input[type="search"]::-webkit-search-cancel-button { filter: grayscale(1) brightness(1.4); cursor: pointer; }
.input.lg { height: 40px; font-size: 15px; font-weight: 600; }
.search { position: relative; display: flex; }
.search > .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search > .input { padding-left: 34px; width: 100%; }
.select { position: relative; display: inline-flex; min-width: 0; }
.select > select {
  appearance: none; height: 34px; width: 100%; padding: 0 32px 0 12px; border-radius: 10px; border: 1px solid var(--line-3);
  background: var(--field); color: var(--text); font-size: 13px; text-overflow: ellipsis; transition: border-color var(--t), box-shadow var(--t);
}
.select > select:hover { border-color: rgba(255, 255, 255, .16); }
.select > select:focus-visible { outline: none; border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.select > select[disabled] { opacity: .45; }
.select > .ico { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.select.sm > select { height: 30px; font-size: 12.5px; border-radius: 8px; }
select option { background: #1B1E24; color: var(--text); }

input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 0; background: transparent; cursor: pointer;
  --p: 50%;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 4px;
  background: linear-gradient(to right, var(--accent) 0 var(--p), rgba(255, 255, 255, .1) var(--p) 100%);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: #F4F6F8;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent), 0 2px 6px rgba(0, 0, 0, .45);
  transition: box-shadow var(--t);
}
input[type="range"]:hover::-webkit-slider-thumb { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 26%, transparent), 0 2px 6px rgba(0, 0, 0, .45); }
input[type="range"]:focus-visible { outline: none; }
input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
input[type="range"][disabled] { opacity: .4; pointer-events: none; }

.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: var(--field); border: 1px solid var(--line-2); }
.seg button {
  height: 30px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: var(--muted);
  font-size: 13px; font-weight: 550; transition: background var(--t), color var(--t); display: inline-flex; align-items: center; gap: 6px;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .05); }
.seg[aria-disabled="true"] { opacity: .45; pointer-events: none; }

.tabs { display: inline-flex; gap: 2px; padding: 4px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; align-self: flex-start; max-width: 100%; overflow-x: auto; }
.tab {
  height: 32px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; color: var(--muted);
  font-size: 13px; font-weight: 550; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  transition: background var(--t), color var(--t);
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { background: var(--surface-3); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .05); }
.tab .badge { height: 18px; padding: 0 6px; font-size: 10.5px; }

.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 10px;
  border: 1px solid var(--line-3); background: var(--surface-2); color: var(--muted); font-size: 13px; font-weight: 550;
  transition: background var(--t), border-color var(--t), color var(--t);
}
.choice:hover { color: var(--text); background: var(--surface-3); }
.choice[aria-pressed="true"] { border-color: var(--accent-line); background: var(--accent-soft); color: var(--text); }
.choice[aria-pressed="true"] .ico { color: var(--accent); }
.choice[disabled] { opacity: .4; pointer-events: none; }

.banner {
  display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line-2);
  background: var(--surface); font-size: 13px;
}
.banner > .ico { margin-top: 1px; }
.banner .txt { min-width: 0; flex: 1; }
.banner-t { font-weight: 600; color: var(--text); }
.banner-d { color: var(--muted); margin-top: 3px; max-width: 760px; }
.banner-a { display: flex; gap: 8px; align-self: center; flex: none; flex-wrap: wrap; justify-content: flex-end; }
.banner.warn { background: color-mix(in srgb, var(--warn) 7%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 26%, transparent); }
.banner.warn > .ico { color: var(--warn); }
.banner.danger { background: color-mix(in srgb, var(--danger) 7%, var(--surface)); border-color: color-mix(in srgb, var(--danger) 28%, transparent); }
.banner.danger > .ico { color: var(--danger); }
.banner.info > .ico { color: var(--accent); }
.banner.calm { background: color-mix(in srgb, var(--accent) 5%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 22%, transparent); }
.banner.calm > .ico { color: var(--accent); }

.srow { display: flex; align-items: center; gap: 24px; padding: 16px 0; border-top: 1px solid var(--line); }
.srow:first-child { border-top: 0; padding-top: 2px; }
.srow:last-child { padding-bottom: 2px; }
.srow .txt { min-width: 0; flex: 1; }
.srow-t { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.srow-d { color: var(--muted); font-size: 12.5px; margin-top: 3px; max-width: 640px; }
.srow-c { flex: none; display: flex; align-items: center; gap: 8px; }

.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 11px 16px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-weight: 550; display: flex; justify-content: flex-end; align-items: center; gap: 8px; min-width: 0; }
.swatch-dot { width: 12px; height: 12px; border-radius: 4px; flex: none; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18); }
.skel { display: inline-block; width: 64px; height: 12px; border-radius: 6px; background: rgba(255, 255, 255, .07); }

.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 40px 20px; color: var(--muted); }
.empty .tile-ico { width: 48px; height: 48px; border-radius: 14px; }
.empty-t { color: var(--text); font-weight: 600; font-size: 14.5px; }

.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .14); border-top-color: var(--accent); animation: rot .8s linear infinite; flex: none; }
.spin.lg { width: 28px; height: 28px; border-width: 3px; }
@keyframes rot { to { transform: rotate(360deg); } }
.bar { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 35%; border-radius: 4px; background: var(--accent); animation: slide 1.2s var(--ease) infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }

/* ---- Popovers, menus, modals, toasts --------------------------------------------------------- */
#layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.pop {
  position: fixed; pointer-events: auto; display: flex; flex-direction: column; background: var(--surface-2);
  border: 1px solid var(--line-3); border-radius: 14px; padding: 6px;
  box-shadow: 0 22px 60px -12px rgba(0, 0, 0, .7), 0 2px 8px rgba(0, 0, 0, .35);
  opacity: 0; transform: translateY(-4px) scale(.985); transform-origin: top right;
  transition: opacity 130ms var(--ease), transform 160ms var(--ease);
}
.pop.in { opacity: 1; transform: none; }
.pop .search { margin: 4px 4px 6px; }
.pop-scroll { overflow: auto; min-height: 0; padding: 2px; }
.pop-foot { display: flex; align-items: center; gap: 10px; padding: 8px 6px 4px; margin-top: 4px; border-top: 1px solid var(--line-2); }
.pop-note { font-size: 11.5px; color: var(--faint); }
.menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 34px; padding: 0 10px; border: 0; border-radius: 8px;
  background: transparent; color: var(--text); font-size: 13px; text-align: left;
}
.menu-item:hover, .menu-item:focus-visible { background: rgba(255, 255, 255, .06); outline: none; }
.menu-item .ico { color: var(--muted); }
.menu-item .hint { margin-left: auto; font-size: 11.5px; color: var(--faint); }
.menu-item.danger { color: var(--danger-text); }
.menu-item.danger .ico { color: inherit; }
.menu-item[disabled] { opacity: .4; pointer-events: none; }
.menu-sep { height: 1px; background: var(--line-2); margin: 5px 4px; }
.pitem {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%;
  padding: 7px 10px 7px 8px; border: 0; border-radius: 10px; background: transparent; color: var(--text); text-align: left;
}
.pitem:hover, .pitem:focus-visible { background: rgba(255, 255, 255, .055); outline: none; }
.pitem[aria-selected="true"] { background: var(--accent-soft); }
.pitem .n { font-size: 13px; font-weight: 600; }
.pitem .s { font-size: 11.5px; color: var(--muted); }
.pitem .tail { display: flex; align-items: center; gap: 6px; color: var(--accent); }
.pitem .tail .badge { height: 20px; }
.pgroup { padding: 8px 10px 4px; }

.avatar {
  width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none;
  font-weight: 700; font-size: 13px; color: #0A0C0F; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12);
}
.avatar.lg { width: 38px; height: 38px; border-radius: 11px; font-size: 15px; }

.backdrop {
  position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px;
  background: rgba(6, 7, 9, .62); opacity: 0; transition: opacity 160ms var(--ease);
}
.backdrop.in { opacity: 1; }
.modal {
  width: min(460px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line-3); border-radius: 18px;
  box-shadow: 0 40px 100px -24px rgba(0, 0, 0, .85), 0 2px 10px rgba(0, 0, 0, .4);
  transform: translateY(8px) scale(.985); transition: transform 180ms var(--ease);
}
.backdrop.in .modal { transform: none; }
.modal-head { display: flex; align-items: flex-start; gap: 14px; padding: 22px 22px 0; }
.modal-head .tile-ico { width: 40px; height: 40px; border-radius: 12px; }
.modal-t { font-size: 16.5px; font-weight: 650; letter-spacing: -.01em; margin-top: 2px; }
.modal-body { padding: 10px 22px 4px; color: var(--muted); font-size: 13.5px; overflow: auto; min-height: 0; }
.modal-body .field { margin-top: 12px; }
.modal-f { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 18px 22px 20px; }
.modal-f .left { margin-right: auto; }
.form-err { color: var(--danger-text); font-size: 12.5px; min-height: 18px; margin-top: 6px; }
.check { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 13px; color: var(--text); cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

#toasts {
  position: fixed; bottom: 22px; left: calc(var(--sidebar-w) + (100vw - var(--sidebar-w)) / 2); transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 90; pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: 10px; min-height: 40px; max-width: 560px; padding: 9px 16px 9px 12px; border-radius: 12px;
  background: #24272E; border: 1px solid var(--line-3); box-shadow: 0 16px 40px -10px rgba(0, 0, 0, .7);
  font-size: 13px; pointer-events: auto; opacity: 0; transform: translateY(8px);
  transition: opacity 160ms var(--ease), transform 180ms var(--ease);
}
.toast.in { opacity: 1; transform: none; }
.toast > .ico { color: var(--accent); }
.toast.error > .ico { color: var(--danger); }
.toast.info > .ico { color: var(--muted); }

/* ---- Boot / no-host -------------------------------------------------------------------------- */
.boot { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
.boot[hidden] { display: none; }
.boot-card { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 420px; }
.boot-t { font-size: 20px; font-weight: 650; letter-spacing: -.015em; }
.boot-d { color: var(--muted); font-size: 13.5px; }
.steps-howto { text-align: left; margin: 6px 0 0; padding: 14px 16px 14px 34px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-2); color: var(--muted); font-size: 13px; }
.steps-howto li { margin: 3px 0; }

/* ---- Overview -------------------------------------------------------------------------------- */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 20px; align-items: center; padding: 22px 24px; }
.orb {
  width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; color: var(--accent);
  background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--accent) 30%, transparent), color-mix(in srgb, var(--accent) 8%, transparent) 70%);
  box-shadow: inset 0 0 0 1px var(--accent-line), 0 10px 30px -12px color-mix(in srgb, var(--accent) 60%, transparent);
}
.orb.idle { color: var(--muted); background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line-3); }
.hero-t { font-size: 20px; font-weight: 650; letter-spacing: -.015em; margin-top: 2px; }
.hero-d { color: var(--muted); font-size: 13px; margin-top: 4px; }
.hero-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.hero-chips .chip .ico { color: var(--muted); }
.hero-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; padding-left: 20px; border-left: 1px solid var(--line); align-self: stretch; justify-content: center; }
.hero-side .lbl { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.hero-side .sub { font-size: 11.5px; color: var(--muted); max-width: 200px; text-align: right; }
.dev-h { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.dev-n { font-weight: 600; font-size: 14px; }
.dev-s { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 1px; }
.stat {
  display: flex; flex-direction: column; gap: 2px; padding: 16px 18px; text-align: left; color: var(--text);
  border: 1px solid var(--line-2); border-radius: var(--radius-lg); background: var(--surface);
  transition: background var(--t), border-color var(--t);
}
button.stat:hover { background: var(--surface-2); border-color: var(--line-3); }
.stat-v { font-size: 24px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 4px; }
.stat-v small { font-size: 14px; color: var(--faint); font-weight: 600; }
.stat-l { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }

/* ---- Profile switcher ------------------------------------------------------------------------ */
.switcher {
  display: inline-flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px 0 6px; max-width: 320px;
  border-radius: 12px; border: 1px solid var(--line-3); background: var(--surface); color: var(--text);
  transition: background var(--t), border-color var(--t);
}
.switcher:hover, .switcher[aria-expanded="true"] { background: var(--surface-2); border-color: rgba(255, 255, 255, .16); }
.switcher .txt { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; line-height: 1.2; }
.switcher .l { font-size: 10.5px; color: var(--faint); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.switcher .n { font-size: 13.5px; font-weight: 600; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.switcher > .ico:last-child { color: var(--muted); }

/* ---- Mouse: buttons -------------------------------------------------------------------------- */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 352px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .split { grid-template-columns: minmax(0, 1fr) 320px; } }
.panel {
  padding: 14px; border-radius: 22px; max-width: 420px; margin: 0 auto;
  background: linear-gradient(160deg, #1B1E24, #121418); border: 1px solid var(--line-2);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 24px 40px -28px rgba(0, 0, 0, .9);
}
.kgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
.krow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 9px; }
.ktile {
  position: relative; height: 60px; min-width: 0; padding: 14px 6px 6px; border-radius: 12px; border: 1px solid var(--line-2);
  background: linear-gradient(180deg, #23262D, #1C1F25); color: var(--text);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .045), 0 2px 0 rgba(0, 0, 0, .4);
  transition: border-color var(--t), background var(--t), box-shadow var(--t);
}
.ktile:hover { border-color: rgba(255, 255, 255, .16); background: linear-gradient(180deg, #282C34, #20232A); }
.ktile .n { position: absolute; top: 5px; left: 8px; font-size: 10.5px; font-weight: 650; color: var(--faint); max-width: calc(100% - 14px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ktile .k { font-size: 15.5px; font-weight: 650; letter-spacing: -.01em; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ktile .m { font-size: 10px; font-weight: 600; color: var(--accent-text); opacity: .8; line-height: 1; margin-bottom: 1px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.ktile.default .k { color: var(--muted); font-weight: 550; }
.ktile.remap { border-color: var(--accent-line); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 15%, #23262D), color-mix(in srgb, var(--accent) 7%, #1C1F25)); }
.ktile.remap .k { color: var(--accent-text); }
.ktile.off { background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .025) 0 6px, transparent 6px 12px), #17191E; border-style: dashed; border-color: var(--line-3); box-shadow: none; }
.ktile.off .k { color: var(--faint); }
.ktile[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.ktile.locked { pointer-events: none; opacity: .55; background: transparent; box-shadow: none; border-style: dashed; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.section-l { display: flex; align-items: center; gap: 10px; margin: 20px 0 10px; }
.section-l .line { flex: 1; height: 1px; background: var(--line); }
.fixed-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; font-size: 12px; color: var(--faint); }
.fixed-row .chip { height: 24px; color: var(--muted); background: transparent; }

.assign { position: sticky; top: 0; display: flex; flex-direction: column; gap: 16px; }
.assign-h { display: flex; align-items: flex-start; gap: 10px; }
.assign-t { font-size: 18px; font-weight: 650; letter-spacing: -.015em; margin-top: 2px; }
.current { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 46px; }
.current .what { font-size: 12.5px; color: var(--muted); margin-left: 4px; }
.capture {
  display: flex; align-items: center; justify-content: center; gap: 10px; height: 44px; border-radius: 12px; padding: 0 14px;
  border: 1px dashed var(--line-3); background: var(--field); color: var(--muted); font-size: 13px; font-weight: 550;
  transition: border-color var(--t), background var(--t), color var(--t);
}
.capture:hover { color: var(--text); border-color: rgba(255, 255, 255, .2); }
.capture.on { border-style: solid; border-color: var(--accent); background: var(--accent-soft); color: var(--text); box-shadow: 0 0 0 3px var(--accent-soft); }
.capture.on .ico { color: var(--accent); }
.mods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.mod {
  height: 32px; border-radius: 9px; border: 1px solid var(--line-3); background: var(--surface-2); color: var(--muted);
  font-size: 12.5px; font-weight: 600; transition: background var(--t), border-color var(--t), color var(--t);
}
.mod:hover { color: var(--text); }
.mod[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-text); }
.mod[disabled] { opacity: .4; pointer-events: none; }
.picker { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.picker-list { max-height: 248px; overflow: auto; margin-right: -8px; padding-right: 4px; }
.picker-list.tall { max-height: 340px; }
.pgroup-t { font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin: 12px 0 7px; }
.pgroup-t:first-child { margin-top: 2px; }
.pgrid { display: flex; flex-wrap: wrap; gap: 5px; }
.pkey {
  height: 30px; min-width: 34px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface-2);
  color: var(--text); font-size: 12.5px; font-weight: 550; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: background var(--t), border-color var(--t);
}
.pkey:hover { background: var(--surface-3); border-color: var(--line-3); }
.pkey.on { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.pkey.wide { padding: 0 12px; }
.assign-f { display: flex; align-items: center; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }

/* ---- Mouse: performance, lighting, onboard, calibration -------------------------------------- */
.dpi-row {
  display: grid; grid-template-columns: 30px 64px minmax(0, 1fr) 96px 30px; gap: 14px; align-items: center;
  padding: 10px 12px; border-radius: 12px; border: 1px solid transparent; transition: background var(--t), border-color var(--t);
}
.dpi-row + .dpi-row { margin-top: 4px; }
.dpi-row.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 22%, transparent); }
.radio {
  width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-3); background: transparent; padding: 0; display: grid; place-items: center;
  transition: border-color var(--t);
}
.radio:hover { border-color: rgba(255, 255, 255, .3); }
.radio[aria-checked="true"] { border-color: var(--accent); }
.radio[aria-checked="true"]::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.dpi-l { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.dpi-row.on .dpi-l { color: var(--text); }
.unit { position: relative; display: flex; }
.unit .input { width: 100%; padding-right: 38px; text-align: right; }
.unit span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11.5px; color: var(--faint); pointer-events: none; }
.big-val { font-size: 30px; font-weight: 650; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.big-val small { font-size: 14px; color: var(--faint); font-weight: 600; margin-left: 4px; }

.light-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; }
.preview {
  border-radius: 16px; background: radial-gradient(120% 90% at 50% 10%, #1D2026, #121418); border: 1px solid var(--line-2);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px 12px 16px; min-height: 280px;
}
.preview svg { overflow: visible; }
.preview .cap { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch {
  width: 30px; height: 30px; border-radius: 9px; border: 0; padding: 0; position: relative;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); transition: transform 90ms;
}
.swatch:hover { transform: scale(1.06); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
.swatch.custom { background: conic-gradient(from 90deg, #ff4d4d, #ffd84d, #4dff88, #4dd8ff, #6a5cff, #ff4dd2, #ff4d4d); display: grid; place-items: center; color: #fff; }
.swatch.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
.hexin { width: 110px; font-family: var(--mono); text-transform: uppercase; }
details.adv { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 4px; }
details.adv summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 550; list-style: none; display: flex; align-items: center; gap: 8px; }
details.adv summary::-webkit-details-marker { display: none; }
details.adv summary .ico { transition: transform var(--t); }
details.adv[open] summary .ico { transform: rotate(90deg); }
details.adv summary:hover { color: var(--text); }
.adv-body { padding: 14px 0 2px 24px; display: flex; flex-direction: column; gap: 12px; }

.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 12px; }
.slot { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line-2); min-height: 178px; }
.slot.live { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 8%, var(--surface-2)), var(--surface-2)); border-color: color-mix(in srgb, var(--accent) 26%, transparent); }
.slot-h { display: flex; align-items: center; gap: 10px; }
.slot-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: 0 0 0 3px rgba(255, 255, 255, .05), 0 0 12px -2px currentColor; }
.slot-n { font-weight: 650; font-size: 13.5px; }
.slot-c { font-size: 12px; color: var(--muted); }
.slot-name { font-size: 13px; font-weight: 600; min-height: 20px; }
.slot-sub { font-size: 12px; color: var(--muted); }
.slot .foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }

.cal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.cal-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line-2); min-width: 0; }
.cal-item .nm { font-size: 12.5px; color: var(--muted); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-item.missing { border-style: dashed; background: transparent; }

/* ---- Keyboard -------------------------------------------------------------------------------- */
.mk-grid { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; align-items: center; }
.cluster { display: grid; grid-template-columns: repeat(3, 62px); grid-template-rows: repeat(2, 62px); gap: 8px; justify-content: center; }
.cluster .kc { width: 100%; height: 100%; border-radius: 12px; flex-direction: column; gap: 3px; padding: 4px; }
.cluster .kc small { font-size: 9.5px; font-weight: 600; color: var(--accent-text); max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cluster .up { grid-column: 2; grid-row: 1; }
.cluster .left { grid-column: 1; grid-row: 2; }
.cluster .down { grid-column: 2; grid-row: 2; }
.cluster .right { grid-column: 3; grid-row: 2; }
.mk-row { display: grid; grid-template-columns: 34px minmax(90px, 140px) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.mk-row:first-child { border-top: 0; }
.mk-row .select { width: 100%; }
.howto { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.howto-step { padding: 16px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 10px; }
.howto-step .keys { display: flex; align-items: center; gap: 6px; }
.howto-step .n { font-size: 11px; font-weight: 650; color: var(--faint); letter-spacing: .07em; text-transform: uppercase; }
.howto-step p { font-size: 12.5px; color: var(--muted); }
.kc.held { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 24%, #2B2F37), color-mix(in srgb, var(--accent) 14%, #23262D)); border-color: var(--accent-line); color: var(--accent-text); box-shadow: 0 1px 0 rgba(0, 0, 0, .45); transform: translateY(1px); }
.kc.ghosted { opacity: .45; }

/* ---- Macros ---------------------------------------------------------------------------------- */
.mac { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
.mlist { display: flex; flex-direction: column; gap: 4px; padding: 8px; }
.mitem {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border-radius: 10px; border: 0;
  background: transparent; color: var(--text); text-align: left; width: 100%; transition: background var(--t);
}
.mitem:hover { background: rgba(255, 255, 255, .045); }
.mitem[aria-current="true"] { background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line-3); }
.mitem .n { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; width: 100%; }
.mitem .s { font-size: 11.5px; color: var(--muted); }
.mitem .dirty { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-left: auto; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn.rec .ico { color: var(--danger); }
.btn.rec.on { background: color-mix(in srgb, var(--danger) 16%, transparent); border-color: color-mix(in srgb, var(--danger) 45%, transparent); color: var(--text); }
.steps { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow: auto; padding-right: 4px; margin-right: -8px; }
.step {
  display: grid; grid-template-columns: 22px 26px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; min-height: 44px; padding: 5px 6px 5px 10px;
  border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line);
}
.step.wait { background: transparent; border-style: dashed; border-color: var(--line-3); }
.step-i { font-size: 11px; color: var(--faint); font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; }
.step-ico { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-3); color: var(--muted); }
.step-ico.down { background: var(--accent-soft); color: var(--accent); }
.step-txt { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 13px; }
.step-delay { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--faint); }
.step-delay .input { width: 78px; height: 30px; text-align: right; padding: 0 8px; border-radius: 8px; }
.step-a { display: flex; gap: 2px; }
.step-a .btn { color: var(--faint); }
.step-a .btn:hover { color: var(--text); }
.rec-note { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; font-size: 12.5px; color: var(--text); background: color-mix(in srgb, var(--danger) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); }
.rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 25%, transparent); flex: none; }

/* ---- Games ----------------------------------------------------------------------------------- */
.running { display: flex; align-items: center; gap: 16px; padding: 16px 18px; background: linear-gradient(100deg, color-mix(in srgb, var(--accent) 10%, var(--surface)), var(--surface) 60%); border-color: color-mix(in srgb, var(--accent) 24%, transparent); }
.running .txt { min-width: 0; flex: 1; }
.running-t { font-size: 14.5px; font-weight: 600; margin-top: 2px; }
.running .act { display: flex; gap: 8px; align-items: center; flex: none; }
.running .select { width: 190px; }
.gtools { display: flex; align-items: center; gap: 10px; }
.gtools .search { width: 300px; }
.glist { overflow: hidden; }
.grow { display: grid; grid-template-columns: 38px minmax(0, 1fr) 196px 34px; gap: 14px; align-items: center; padding: 13px 16px; border-top: 1px solid var(--line); }
.grow:first-child { border-top: 0; }
.grow.flash { background: var(--accent-soft); }
.g-name { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.g-t { font-weight: 600; font-size: 13.5px; }
.g-exes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.g-exes .chip { height: 24px; padding: 0 8px; font-size: 12px; }
.g-kb .select { width: 100%; }
.shield { color: #9DB4FF; background: rgba(120, 150, 255, .12); }

.leftover { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.leftover:first-child { border-top: 0; padding-top: 0; }
.leftover .ico { color: var(--muted); }
.leftover .t { font-size: 13px; font-weight: 600; }
.leftover .d { font-size: 12px; color: var(--muted); margin-top: 1px; }
.risk { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.risk > div { padding: 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line-2); font-size: 12.5px; color: var(--muted); }
.risk b { display: block; margin-bottom: 4px; font-size: 13px; }
.accents { display: flex; gap: 12px; flex-wrap: wrap; }
.accent-opt {
  display: flex; flex-direction: column; align-items: center; gap: 8px; width: 92px; padding: 14px 8px 12px; border-radius: 14px;
  border: 1px solid var(--line-2); background: var(--surface-2); color: var(--muted); font-size: 12.5px; font-weight: 550;
  transition: border-color var(--t), background var(--t), color var(--t);
}
.accent-opt:hover { color: var(--text); background: var(--surface-3); }
.accent-opt[aria-pressed="true"] { border-color: var(--line-3); color: var(--text); background: var(--surface-3); }
.accent-opt i { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #0A0C0F; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2); }
.maint { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.maint button {
  display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 13px; border: 1px solid var(--line-2);
  background: var(--surface-2); color: var(--text); text-align: left; transition: background var(--t), border-color var(--t);
}
.maint button:hover { background: var(--surface-3); border-color: var(--line-3); }
.maint .t { font-weight: 600; font-size: 13px; }
.maint .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
.maint .ico { color: var(--muted); margin-top: 1px; }
.log {
  margin: 0; height: 430px; overflow: auto; padding: 14px 16px; border-radius: 12px; background: var(--field); border: 1px solid var(--line-2);
  font: 12px/1.65 var(--mono); color: #C4C8CF; white-space: pre-wrap; word-break: break-word;
}
.log .tm { color: var(--faint); }
.ac-list { display: flex; flex-wrap: wrap; gap: 6px; }

@media (max-width: 1100px) {
  .light-grid { grid-template-columns: 190px minmax(0, 1fr); }
  .mk-grid { grid-template-columns: 1fr; }
  .gtools .search { width: 240px; }
  .grow { grid-template-columns: 38px minmax(0, 1fr) 170px 34px; }
  .hero { grid-template-columns: auto minmax(0, 1fr); }
  .hero-side { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 14px; }
  .hero-side .sub { text-align: left; max-width: none; }
}
</style>
